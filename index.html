<!DOCTYPE html>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fsociety // decoder</title>
    <!-- Aqui conectamos o arquivo de estilo CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="terminal-container">
        <h1>fsociety_decoder</h1>
        <p>Insira os dados:</p>

        <input type="text" id="inputCodigo" placeholder="Ex: 24.16     6.11.8.12.21.18" autocomplete="off">
        
        <!-- Botão de ação -->
        <button id="btnCodificar">Codificar</button>
        <button id="btnDecodificar">Decodificar</button>
        
        <!-- Tela de resultado -->
        <div class="output-box">
            <span id="resultado">> _</span>
        </div>
    </div>

    <script src="script.js"></script>
